<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weekly Highlights Marketing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Yellowtail&display=swap">
<style>
/* Layout: brand band with week badge, then one narrow column of three numbered sections and a send panel. */
:root{
  --blue:#004993; --blue-soft:#E8EFF8;
  --bg:#F2F5F9; --card:#FFFFFF; --ink:#0E1C30; --muted:#566377; --line:#D9E1EC; --field:#F7F9FC;
  --gold:#B1934B; --red:#C0281A; --ok:#2F6B3F; --ok-soft:#E6F2E9;
  --band-sub:#D7E3F3;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Arial,sans-serif;
  --script:"Yellowtail","Brush Script MT",cursive;
  --mono:Consolas,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --blue:#6FA3E0; --blue-soft:#16263B;
  --bg:#0C1522; --card:#132033; --ink:#E6ECF4; --muted:#9AA8BB; --line:#26364C; --field:#0F1A2A;
  --gold:#D2B46B; --red:#FF7A6B; --ok:#7CC48E; --ok-soft:#14301F; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--body)}
[hidden]{display:none!important}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:600 15px var(--body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 16px;cursor:pointer}
button:hover{border-color:var(--blue)}
button:disabled{opacity:.55;cursor:wait}
:is(button,input,textarea,.drop):focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.primary{background:#004993;border-color:#004993;color:#fff;font-size:17px;padding:12px 24px}
button.primary:hover:not(:disabled){background:#00356B}
button.link{border:0;background:none;padding:4px 6px;color:var(--muted);font-weight:500;font-size:14px}
button.link:hover{color:var(--red);text-decoration:underline}

.band{background:#004993;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 14px,transparent 14px 28px),radial-gradient(circle at 85% -20%,rgba(231,211,164,.25),transparent 55%);color:#fff;border-bottom:4px solid #B1934B}
.band .wrap{padding-block:22px 30px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.brand h1{font:700 32px/1 var(--display);margin:0;letter-spacing:.06em;text-transform:uppercase}
.brand p{margin:4px 0 0;font:600 13px var(--display);letter-spacing:.18em;text-transform:uppercase;color:#E7D3A4}
.right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kw{background:rgba(0,30,70,.45);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:5px 14px;text-align:center;line-height:1.15;font-variant-numeric:tabular-nums}
.kw b{display:block;font:700 24px var(--display);letter-spacing:.04em}
.kw span{font-size:13px;color:var(--band-sub)}
.seg{display:flex;gap:2px}
.seg button{padding:5px 9px;font-size:13px;border-radius:8px;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
.seg button[aria-pressed="true"]{background:#fff;color:#004993;border-color:#fff}
.hero{margin-top:26px}
.hero .script{font:34px/1 var(--script);color:#E7D3A4;display:block}
.hero h2{font:700 clamp(28px,5vw,40px)/1.05 var(--display);margin:0;text-transform:uppercase;letter-spacing:.03em;text-wrap:balance}
.hero p{margin:8px 0 0;color:var(--band-sub);max-width:60ch}

main.wrap{padding-block:26px 70px;display:grid;gap:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.row2{grid-template-columns:1fr}}
label{display:grid;gap:6px;font-weight:600;font-size:15px;min-width:0}
label small{font-weight:400;color:var(--muted)}
input,textarea{font:16px var(--body);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
textarea{resize:vertical;min-height:96px}
input.invalid{border-color:var(--red)}
.sec{display:grid;gap:12px}
.sec h3{display:flex;align-items:center;gap:10px;font:700 23px var(--display);text-transform:uppercase;letter-spacing:.05em;margin:0;color:var(--blue)}
.sec h3::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--gold),transparent)}
.sec h3 .n{width:30px;height:30px;border-radius:50%;background:#004993;color:#fff;display:grid;place-items:center;font-size:17px;flex:none}
.sec .hint{margin:-6px 0 0;color:var(--muted);font-size:15px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.item .top{display:flex;justify-content:space-between;align-items:center}
.item .top span{font:700 14px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.add{justify-self:start;color:var(--blue);border-color:var(--blue);border-style:dashed;background:transparent}

.media{display:grid;gap:8px}
.media > span{font-weight:600;font-size:15px}
.drop{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);border-radius:10px;padding:14px;color:var(--muted);font-size:15px;cursor:pointer;background:var(--field);text-align:center}
.drop:hover,.drop.over{border-color:var(--blue);color:var(--blue)}
.files{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.files li{display:flex;align-items:center;gap:10px;background:var(--blue-soft);border-radius:8px;padding:6px 8px;font-size:14px;min-width:0}
.files img,.files .vid{width:44px;height:44px;border-radius:6px;object-fit:cover;flex:none;background:var(--line);display:grid;place-items:center;font-size:18px}
.files .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files .sz{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.files li.bad{background:transparent;border:1px solid var(--red)}
.files li.bad .sz{color:var(--red)}

.send{background:var(--card);border:2px solid var(--blue);border-radius:14px;padding:20px;display:grid;gap:12px}
.send h3{font:700 24px var(--display);text-transform:uppercase;letter-spacing:.05em;margin:0;color:var(--blue)}
.send p{margin:0}
.muted{color:var(--muted);font-size:15px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);width:0}
.meter.over i{background:var(--red)}
.status{font-size:15px;color:var(--muted);min-height:1.5em}
.status.ok{color:var(--ok);font-weight:600}
.status.err{color:var(--red);font-weight:600}
.saved{font-size:13px;color:var(--muted)}
.done{background:var(--ok-soft);border:2px solid var(--ok);border-radius:14px;padding:24px;display:grid;gap:10px}
.done h3{font:700 26px var(--display);text-transform:uppercase;letter-spacing:.05em;margin:0;color:var(--ok)}
pre{font:14px/1.55 var(--mono);white-space:pre-wrap;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0;max-height:320px;overflow:auto;color:var(--ink)}
details summary{cursor:pointer;color:var(--muted);font-size:15px}
.footer{text-align:center;font:28px var(--script);color:var(--blue)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- Static copy of the form so Netlify registers it at deploy time. Field names must match what the script sends. -->
<form name="weekly-highlights" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
  <input name="bot-field"><input name="subject"><input name="name"><input type="email" name="email"><input name="week">
  <textarea name="contribution"></textarea>
  <input type="file" name="media1"><input type="file" name="media2"><input type="file" name="media3"><input type="file" name="media4">
  <input type="file" name="media5"><input type="file" name="media6"><input type="file" name="media7"><input type="file" name="media8">
</form>

<div class="band"><div class="wrap">
  <header>
    <div class="brand"><h1>Weekly Highlights</h1><p>Marketing Feldschlösschen</p></div>
    <div class="right">
      <div class="kw"><b id="kwLabel"></b><span id="rangeLabel"></span></div>
      <div class="seg" role="group" aria-label="Woche"><button id="wkThis" type="button" aria-pressed="true"></button><button id="wkLast" type="button" aria-pressed="false"></button></div>
      <div class="seg" role="group" aria-label="Sprache / Langue"><button id="langDE" type="button" aria-pressed="true">DE</button><button id="langFR" type="button" aria-pressed="false">FR</button></div>
    </div>
  </header>
  <div class="hero">
    <span class="script" id="t-script"></span>
    <h2 id="t-hero"></h2>
    <p id="t-heroSub"></p>
  </div>
</div></div>

<main class="wrap">
  <div id="formArea" style="display:grid;gap:26px">
    <div class="card">
      <div class="row2">
        <label for="name"><span id="t-name"></span><input id="name" autocomplete="name"></label>
        <label for="email"><span><span id="t-email"></span> <small id="t-emailHint"></small></span><input id="email" type="email" autocomplete="email"></label>
      </div>
    </div>
    <div id="sections" style="display:grid;gap:26px"></div>
    <div class="send">
      <h3 id="t-sendTitle"></h3>
      <p class="muted" id="t-sendHint"></p>
      <div id="meterBox" hidden><div class="meter" id="meter"><i></i></div><span class="muted" id="meterLabel"></span></div>
      <div class="bar">
        <button class="primary" id="sendBtn" type="button"></button>
        <button class="link" id="resetBtn" type="button"></button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <span class="saved" id="saved"></span>
      <details id="previewBox"><summary id="t-preview"></summary><pre id="preview"></pre>
        <div class="bar" style="margin-top:10px"><button id="copyBtn" type="button"></button></div>
      </details>
    </div>
  </div>
  <div class="done" id="doneBox" hidden>
    <h3 id="t-doneTitle"></h3>
    <p id="t-doneText"></p>
    <div class="bar"><button id="againBtn" type="button"></button></div>
  </div>
  <div class="footer">Merci &amp; Proscht!</div>
</main>

<script>
const RECIPIENT_NAME = "Astrid";
const MAX_BYTES = 7.5*1024*1024;   // Netlify accepts at most 8 MB per submission
const MAX_FILES = 8;               // one file per form field: media1 … media8

const PARTS = [
  {id:"highlight", n:1, fields:["title","detail","kpi","next","link"], media:true,
   de:{name:"Highlights der Woche", hint:"Was ist diese Woche gelaufen? Ein Punkt pro Thema.", title:"Worum geht's?", titlePh:"Eine Runde auf uns – McArthur's Pub, Lenzburg", detail:"Was ist passiert?", detailPh:"Z. B.: Sechste Runde unserer Gastro-Aktion, 9 KEG in gut zwei Stunden. Danke an alle!", kpi:"Wichtigste Zahl", kpiPh:"9 KEG in 2 Std.", next:"Nächster Termin", nextPh:"Letzter Halt: Delémont am 10.09.", link:"Link zu Video oder Ordner", linkPh:"OneDrive-, SharePoint- oder WeTransfer-Link", add:"+ Weiteres Highlight", item:"Highlight"},
   fr:{name:"Les temps forts de la semaine", hint:"Qu'est-ce qui s'est passé cette semaine ? Un point par sujet.", title:"De quoi s'agit-il ?", titlePh:"Une tournée offerte – McArthur's Pub, Lenzburg", detail:"Que s'est-il passé ?", detailPh:"P. ex. : 6e étape de notre action gastro, 9 KEG en à peine deux heures. Merci à toutes et à tous !", kpi:"Chiffre clé", kpiPh:"9 KEG en 2 h", next:"Prochaine date", nextPh:"Dernière étape : Delémont le 10.09.", link:"Lien vers une vidéo ou un dossier", linkPh:"Lien OneDrive, SharePoint ou WeTransfer", add:"+ Ajouter un temps fort", item:"Temps fort"}},
  {id:"outlook", n:2, fields:["title"],
   de:{name:"Ausblick nächste Woche", hint:"Was steht nächste Woche an? Eine Zeile reicht.", title:"Was steht an?", titlePh:"OLMA-Vorbereitungen", add:"+ Weiterer Punkt", item:"Ausblick"},
   fr:{name:"La semaine prochaine", hint:"Qu'est-ce qui est prévu ? Une ligne suffit.", title:"Qu'est-ce qui est prévu ?", titlePh:"Préparatifs OLMA", add:"+ Ajouter un point", item:"Point"}},
  {id:"team", n:3, fields:["title","detail"],
   de:{name:"Team", hint:"Neue Gesichter, Jubiläen, ein Dankeschön.", title:"Was gibt's Neues?", titlePh:"Willkommen im Team, …", detail:"Ein, zwei Sätze dazu", detailPh:"Seit Montag verstärkt … das Brand-Team.", add:"+ Weitere Team-News", item:"Team-News"},
   fr:{name:"L'équipe", hint:"Arrivées, anniversaires de service, un merci.", title:"Quoi de neuf ?", titlePh:"Bienvenue dans l'équipe, …", detail:"Une ou deux phrases", detailPh:"Depuis lundi, … renforce l'équipe Brand.", add:"+ Ajouter une nouvelle", item:"Nouvelle"}}
];
const T = {
  de:{script:"Proscht!", hero:"Dein Beitrag für diese Woche", heroSub:"Fülle aus, was du hast – leere Felder werden ignoriert. Mit «Senden» geht dein Beitrag samt Fotos direkt an "+RECIPIENT_NAME+".",
      name:"Dein Name", email:"Deine E-Mail", emailHint:"(optional, für Rückfragen)", sendTitle:"Fertig?", sendHint:"Ein Klick genügt: Text, Fotos und Videos werden direkt an "+RECIPIENT_NAME+" geschickt.",
      send:"Senden", sending:"Wird gesendet …", reset:"Alles leeren", preview:"Vorschau des Textes", copy:"Text kopieren", remove:"Entfernen",
      media:"Fotos und Videos", drop:"Fotos oder Videos auswählen – oder hierher ziehen", tooBig:"zu gross", photoNote:"Fotos werden automatisch verkleinert. Videos: max. 7,5 MB insgesamt – grössere Videos bitte als Link angeben.",
      thisW:"Diese Woche", lastW:"Letzte Woche",
      needName:"Bitte zuerst deinen Namen eintragen.", empty:"Du hast noch nichts eingetragen.",
      overLimit:"Die Dateien sind zusammen zu gross (max. 7,5 MB). Bitte ein Video entfernen und als Link angeben.", tooMany:"Höchstens "+MAX_FILES+" Dateien pro Beitrag.",
      sendFail:"Senden hat nicht geklappt. Bitte nochmals versuchen. Falls es wieder scheitert: Vorschau öffnen, Text kopieren und per Mail an "+RECIPIENT_NAME+" schicken.",
      doneTitle:"Danke!", doneText:"Dein Beitrag ist bei "+RECIPIENT_NAME+" angekommen.", again:"Neuen Beitrag erfassen",
      copied:"Kopiert.", copyFail:"Text markiert – mit Strg+C kopieren.", confirmReset:"Nochmals klicken zum Leeren", savedAt:"Entwurf gespeichert", total:"von 7,5 MB", kw:"KW"},
  fr:{script:"Santé !", hero:"Votre contribution de la semaine", heroSub:"Remplissez ce que vous avez – les champs vides sont ignorés. Avec « Envoyer », votre contribution part directement chez "+RECIPIENT_NAME+", photos comprises.",
      name:"Votre nom", email:"Votre e-mail", emailHint:"(facultatif, pour les questions)", sendTitle:"C'est prêt ?", sendHint:"Un clic suffit : le texte, les photos et les vidéos sont envoyés directement à "+RECIPIENT_NAME+".",
      send:"Envoyer", sending:"Envoi en cours …", reset:"Tout effacer", preview:"Aperçu du texte", copy:"Copier le texte", remove:"Retirer",
      media:"Photos et vidéos", drop:"Choisir des photos ou des vidéos – ou les glisser ici", tooBig:"trop lourd", photoNote:"Les photos sont réduites automatiquement. Vidéos : 7,5 Mo au total au maximum – pour une vidéo plus lourde, indiquez un lien.",
      thisW:"Cette semaine", lastW:"Semaine passée",
      needName:"Indiquez d'abord votre nom.", empty:"Vous n'avez encore rien saisi.",
      overLimit:"Les fichiers sont trop lourds au total (7,5 Mo au maximum). Retirez une vidéo et indiquez plutôt un lien.", tooMany:"Au maximum "+MAX_FILES+" fichiers par contribution.",
      sendFail:"L'envoi n'a pas abouti. Réessayez. Si cela échoue encore : ouvrez l'aperçu, copiez le texte et envoyez-le par e-mail à "+RECIPIENT_NAME+".",
      doneTitle:"Merci !", doneText:"Votre contribution est bien arrivée chez "+RECIPIENT_NAME+".", again:"Saisir une nouvelle contribution",
      copied:"Copié.", copyFail:"Texte sélectionné – copiez-le avec Ctrl+C.", confirmReset:"Cliquez encore pour effacer", savedAt:"Brouillon enregistré", total:"sur 7,5 Mo", kw:"S"}
};

const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get("whb-lang")||((navigator.language||"").toLowerCase().startsWith("fr")?"fr":"de");
const tr=k=>T[lang][k];

function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();return{y,w:Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7)};}
const fmt=d=>d.getDate()+"."+(d.getMonth()+1)+".";
function weekInfo(offset){
  const m=mondayOf(new Date()); m.setDate(m.getDate()-7*offset);
  const {y,w}=isoWeek(m); const s=new Date(m); s.setDate(s.getDate()+6);
  return {week:w, key:y+"-W"+String(w).padStart(2,"0"), range:fmt(m)+" – "+fmt(s)+s.getFullYear()};
}
let offset=0, W=weekInfo(0);

// Files live only in memory (browsers cannot keep them in a saved draft).
const FILES=new WeakMap();   // item object -> [{name, blob, kind, url}]
const filesOf=it=>{ if(!FILES.has(it)) FILES.set(it,[]); return FILES.get(it); };
const mb=b=>(b/1048576).toLocaleString(lang==="fr"?"fr-CH":"de-CH",{maximumFractionDigits:1})+" MB";

const blank=()=>({highlight:[{}],outlook:[{}],team:[{}]});
function loadDraft(){ try{ const s=JSON.parse(store.get("whb-draft")||"null"); if(s&&s.week===W.key&&s.items) return s.items; }catch(e){} return blank(); }
let state=loadDraft();
$("name").value=store.get("whb-name")||"";
$("email").value=store.get("whb-email")||"";
let saveTimer;
function save(){
  store.set("whb-draft",JSON.stringify({week:W.key,items:state}));
  store.set("whb-name",$("name").value.trim()); store.set("whb-email",$("email").value.trim());
  updatePreview();
  clearTimeout(saveTimer); $("saved").textContent=tr("savedAt")+" ✓";
  saveTimer=setTimeout(()=>{$("saved").textContent="";},2500);
}

// Shrink photos to max 1600 px (JPEG) so several fit under Netlify's 8 MB limit.
async function prepare(file){
  const isImg=file.type.startsWith("image/") && !/gif|svg/.test(file.type);
  if(isImg){
    try{
      const bmp=await createImageBitmap(file);
      const scale=Math.min(1,1600/Math.max(bmp.width,bmp.height));
      const c=document.createElement("canvas"); c.width=Math.round(bmp.width*scale); c.height=Math.round(bmp.height*scale);
      c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
      const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
      if(blob && blob.size<file.size) return {name:file.name.replace(/\.[^.]+$/,"")+".jpg", blob, kind:"img"};
    }catch(e){}
    return {name:file.name, blob:file, kind:"img"};
  }
  return {name:file.name, blob:file, kind:file.type.startsWith("video/")?"vid":"file"};
}
async function addFiles(it,list){
  const arr=filesOf(it);
  for(const f of list){
    if(allFiles().length>=MAX_FILES){ setStatus(tr("tooMany"),"err"); break; }
    const p=await prepare(f); p.url=p.kind==="img"?URL.createObjectURL(p.blob):""; arr.push(p);
  }
  render();
}
function allFiles(){ const out=[]; state.highlight.forEach(it=>filesOf(it).forEach(f=>out.push(f))); return out; }
function totalBytes(){ return allFiles().reduce((s,f)=>s+f.blob.size,0); }

function render(){
  document.documentElement.lang=lang;
  ["script","hero","heroSub","name","email","emailHint","sendTitle","sendHint","preview","doneTitle","doneText"].forEach(k=>$("t-"+k).textContent=tr(k));
  $("sendBtn").textContent=tr("send"); $("resetBtn").textContent=tr("reset"); $("copyBtn").textContent=tr("copy"); $("againBtn").textContent=tr("again");
  $("wkThis").textContent=tr("thisW"); $("wkLast").textContent=tr("lastW");
  $("wkThis").setAttribute("aria-pressed",offset===0); $("wkLast").setAttribute("aria-pressed",offset===1);
  $("kwLabel").textContent=tr("kw")+" "+W.week; $("rangeLabel").textContent=W.range;
  $("langDE").setAttribute("aria-pressed",lang==="de"); $("langFR").setAttribute("aria-pressed",lang==="fr");
  const box=$("sections"); box.innerHTML="";
  PARTS.forEach(p=>{
    const L=p[lang];
    const sec=document.createElement("section"); sec.className="sec";
    const h=document.createElement("h3"); const n=document.createElement("span"); n.className="n"; n.textContent=p.n; const t=document.createElement("span"); t.textContent=L.name; h.append(n,t);
    const hint=document.createElement("p"); hint.className="hint"; hint.textContent=L.hint;
    sec.append(h,hint);
    state[p.id].forEach((it,ix)=>{
      const card=document.createElement("div"); card.className="item";
      const top=document.createElement("div"); top.className="top";
      const lbl=document.createElement("span"); lbl.textContent=L.item+" "+(ix+1); top.append(lbl);
      if(state[p.id].length>1){ const rm=document.createElement("button"); rm.className="link"; rm.type="button"; rm.textContent=tr("remove"); rm.onclick=()=>{ state[p.id].splice(ix,1); save(); render(); }; top.append(rm); }
      card.append(top);
      const mk=(f,multi)=>{ const l=document.createElement("label"); const s=document.createElement("span"); s.textContent=L[f]; l.append(s);
        const el=document.createElement(multi?"textarea":"input"); el.placeholder=L[f+"Ph"]||""; el.value=it[f]||""; el.id=p.id+"-"+ix+"-"+f;
        el.addEventListener("input",()=>{ it[f]=el.value; save(); }); l.append(el); return l; };
      if(p.fields.includes("title")) card.append(mk("title"));
      if(p.fields.includes("detail")) card.append(mk("detail",true));
      if(p.fields.includes("kpi")){ const r=document.createElement("div"); r.className="row2"; r.append(mk("kpi"),mk("next")); card.append(r); }
      if(p.media) card.append(mediaBlock(it,p.id+"-"+ix), mk("link"));
      sec.append(card);
    });
    const add=document.createElement("button"); add.type="button"; add.className="add"; add.textContent=L.add;
    add.onclick=()=>{ state[p.id].push({}); save(); render(); const last=$(p.id+"-"+(state[p.id].length-1)+"-title"); if(last) last.focus(); };
    sec.append(add);
    box.append(sec);
  });
  updateMeter(); updatePreview();
}
function mediaBlock(it,key){
  const wrap=document.createElement("div"); wrap.className="media";
  const head=document.createElement("span"); head.textContent=tr("media"); wrap.append(head);
  const input=document.createElement("input"); input.type="file"; input.multiple=true; input.accept="image/*,video/*"; input.hidden=true; input.id=key+"-files";
  input.onchange=()=>{ addFiles(it,[...input.files]); input.value=""; };
  const drop=document.createElement("div"); drop.className="drop"; drop.tabIndex=0; drop.setAttribute("role","button"); drop.textContent="📎 "+tr("drop");
  drop.onclick=()=>input.click(); drop.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); input.click(); } };
  drop.ondragover=e=>{ e.preventDefault(); drop.classList.add("over"); }; drop.ondragleave=()=>drop.classList.remove("over");
  drop.ondrop=e=>{ e.preventDefault(); drop.classList.remove("over"); addFiles(it,[...e.dataTransfer.files]); };
  wrap.append(input,drop);
  const list=document.createElement("ul"); list.className="files";
  filesOf(it).forEach((f,i)=>{
    const li=document.createElement("li"); if(f.blob.size>MAX_BYTES) li.className="bad";
    let th; if(f.url){ th=document.createElement("img"); th.src=f.url; th.alt=""; } else { th=document.createElement("span"); th.className="vid"; th.textContent=f.kind==="vid"?"🎬":"📄"; }
    const nm=document.createElement("span"); nm.className="nm"; nm.textContent=f.name;
    const sz=document.createElement("span"); sz.className="sz"; sz.textContent=mb(f.blob.size)+(f.blob.size>MAX_BYTES?" – "+tr("tooBig"):"");
    const rm=document.createElement("button"); rm.className="link"; rm.type="button"; rm.textContent=tr("remove");
    rm.onclick=()=>{ if(f.url) URL.revokeObjectURL(f.url); filesOf(it).splice(i,1); render(); };
    li.append(th,nm,sz,rm); list.append(li);
  });
  if(filesOf(it).length) wrap.append(list);
  const note=document.createElement("small"); note.className="muted"; note.textContent=tr("photoNote"); wrap.append(note);
  return wrap;
}
function updateMeter(){
  const n=allFiles().length, b=totalBytes();
  $("meterBox").hidden=!n;
  $("meter").classList.toggle("over",b>MAX_BYTES);
  $("meter").firstElementChild.style.width=Math.min(100,b/MAX_BYTES*100)+"%";
  $("meterLabel").textContent=n+" · "+mb(b)+" "+tr("total");
}

// Fixed, machine-readable format. Headings stay German in every language so the compiled mail stays uniform.
function buildText(){
  const name=$("name").value.trim();
  const clean=s=>(s||"").replace(/\r/g,"").replace(/\n{3,}/g,"\n\n").trim();
  const lines=["Weekly Highlights – KW "+W.week+" ("+W.key+") – von "+(name||"?"),""];
  const heads={highlight:"HIGHLIGHTS DER WOCHE",outlook:"AUSBLICK NÄCHSTE WOCHE",team:"TEAM"};
  let count=0, fileNo=0;
  PARTS.forEach(p=>{
    const items=state[p.id].filter(i=>clean(i.title)||clean(i.detail)||(p.media&&filesOf(i).length));
    if(!items.length) return;
    lines.push(heads[p.id]);
    items.forEach(i=>{
      count++;
      const title=clean(i.title), detail=clean(i.detail);
      lines.push("* "+(title||detail.split("\n")[0]||"(ohne Titel)"));
      const rest=title?detail:detail.split("\n").slice(1).join("\n").trim();
      if(rest) rest.split("\n").forEach(l=>lines.push("  "+l));
      if(clean(i.kpi)) lines.push("  Zahl: "+clean(i.kpi));
      if(clean(i.next)) lines.push("  Nächster Termin: "+clean(i.next));
      if(clean(i.link)) lines.push("  Link: "+clean(i.link));
      if(p.media){ const fs=filesOf(i); if(fs.length) lines.push("  Dateien: "+fs.map(f=>"media"+(++fileNo)+" ("+f.name+")").join(", ")); }
    });
    lines.push("");
  });
  lines.push("-- Ende Weekly Highlights --");
  return {text:lines.join("\n"),count,name};
}
function updatePreview(){ $("preview").textContent=buildText().text; }
function setStatus(msg,kind){ const s=$("status"); s.textContent=msg; s.className="status"+(kind?" "+kind:""); }

$("sendBtn").onclick=async ()=>{
  const b=buildText(); $("name").classList.toggle("invalid",!b.name);
  if(!b.name){ setStatus(tr("needName"),"err"); $("name").focus(); return; }
  if(!b.count){ setStatus(tr("empty"),"err"); return; }
  const files=allFiles();
  if(files.length>MAX_FILES){ setStatus(tr("tooMany"),"err"); return; }
  if(totalBytes()>MAX_BYTES){ setStatus(tr("overLimit"),"err"); return; }
  const fd=new FormData();
  fd.append("form-name","weekly-highlights");
  fd.append("bot-field","");
  fd.append("subject","Weekly Highlights KW "+W.week+" – "+b.name);
  fd.append("name",b.name);
  fd.append("email",$("email").value.trim());
  fd.append("week",W.key);
  fd.append("contribution",b.text);
  files.forEach((f,i)=>fd.append("media"+(i+1),f.blob,f.name));
  const btn=$("sendBtn"); btn.disabled=true; btn.textContent=tr("sending"); setStatus("");
  try{
    const res=await fetch("/",{method:"POST",body:fd});
    if(!res.ok) throw new Error(res.status);
    files.forEach(f=>f.url&&URL.revokeObjectURL(f.url));
    state=blank(); store.set("whb-draft",JSON.stringify({week:W.key,items:state}));
    $("formArea").hidden=true; $("doneBox").hidden=false; window.scrollTo(0,0);
  }catch(e){
    setStatus(tr("sendFail"),"err");
  }finally{ btn.disabled=false; btn.textContent=tr("send"); }
};
$("copyBtn").onclick=()=>{
  const text=buildText().text;
  const fail=()=>{ const r=document.createRange(); r.selectNodeContents($("preview")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); setStatus(tr("copyFail"),"err"); };
  try{ navigator.clipboard.writeText(text).then(()=>setStatus(tr("copied"),"ok"),fail); }catch(e){ fail(); }
};
$("againBtn").onclick=()=>{ $("doneBox").hidden=true; $("formArea").hidden=false; setStatus(""); render(); };
$("resetBtn").onclick=()=>{
  const r=$("resetBtn");
  if(!r.dataset.arm){ r.dataset.arm="1"; r.textContent=tr("confirmReset"); setTimeout(()=>{delete r.dataset.arm; r.textContent=tr("reset");},4000); return; }
  delete r.dataset.arm; state=blank(); save(); render(); setStatus("");
};
$("name").addEventListener("input",()=>{ $("name").classList.remove("invalid"); save(); });
$("email").addEventListener("input",save);
function setWeek(o){ offset=o; W=weekInfo(o); state=loadDraft(); render(); setStatus(""); }
$("wkThis").onclick=()=>setWeek(0);
$("wkLast").onclick=()=>setWeek(1);
$("langDE").onclick=()=>{ lang="de"; store.set("whb-lang","de"); render(); };
$("langFR").onclick=()=>{ lang="fr"; store.set("whb-lang","fr"); render(); };
render();
</script>
