<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weekly Highlights Marketing</title>
<link rel="icon" href="/assets/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Yellowtail&display=swap">
<style>
/* Layout: brand band (pattern + logo), three section cards, sticky send bar at the bottom. */
:root{
  --brand:#000B72; --brand-hover:#00095A; --brand-soft:#E9EBF7;
  --bg:#F3F4F9; --card:#FFFFFF; --ink:#111633; --muted:#5B6180; --line:#DDE0EE; --field:#F8F9FC;
  --gold:#B1934B; --red:#D02A12; --ok:#2F6B3F; --ok-soft:#E7F2EA;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Arial,sans-serif;
  --script:"Yellowtail","Brush Script MT",cursive;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --brand-soft:#1A1F45; --bg:#0B0E24; --card:#141936; --ink:#E8EAF6; --muted:#A0A6C4; --line:#272E55; --field:#10142E;
  --gold:#D2B46B; --red:#FF7A66; --ok:#7CC48E; --ok-soft:#13301F; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--body)}
[hidden]{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:600 15px var(--body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 16px;cursor:pointer;transition:border-color .15s,background .15s}
button:hover{border-color:var(--brand)}
button:disabled{opacity:.55;cursor:wait}
:is(button,input,textarea,.drop):focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-size:17px;padding:12px 28px}
.primary:hover:not(:disabled){background:var(--brand-hover)}
.ghost{background:transparent;border:0;color:var(--muted);font-weight:500;font-size:14px;padding:4px 6px}
.ghost:hover{color:var(--red)}

/* Brand band */
.band{background:linear-gradient(180deg,rgba(0,11,114,.35),rgba(0,11,114,.7)),#000B72 url("/assets/pattern.jpg") center/cover;color:#fff;border-bottom:4px solid #B1934B}
.band .wrap{padding-block:18px 34px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:54px;height:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.brand b{display:block;font:700 28px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.brand span{font:600 12px var(--display);letter-spacing:.2em;text-transform:uppercase;color:#E7D3A4}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{background:rgba(0,5,50,.55);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;font-size:14px;backdrop-filter:blur(2px)}
.chip b{font:700 18px var(--display);letter-spacing:.05em}
.chip button{padding:4px 10px;font-size:13px;border-radius:999px;background:rgba(255,255,255,.14);border-color:transparent;color:#fff}
.chip button:hover{background:rgba(255,255,255,.28)}
.lang{display:flex;background:rgba(0,5,50,.55);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px}
.lang button{padding:4px 12px;font-size:13px;border-radius:999px;border:0;background:transparent;color:#fff}
.lang button[aria-pressed="true"]{background:#fff;color:#000B72}
.hero{margin-top:28px;max-width:640px}
.hero .script{font:34px/1 var(--script);color:#E7D3A4;display:block}
.hero h1{font:700 clamp(30px,5.5vw,44px)/1.02 var(--display);margin:2px 0 0;text-transform:uppercase;letter-spacing:.03em;text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,40,.5)}
.hero p{margin:10px 0 0;color:#E4E7F7;text-shadow:0 1px 8px rgba(0,0,40,.6)}

/* Sections */
main.wrap{padding-block:26px 140px;display:grid;gap:22px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.sec > header{display:flex;gap:14px;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--line)}
.num{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font:700 19px var(--display);flex:none}
.sec h2{font:700 24px/1.1 var(--display);text-transform:uppercase;letter-spacing:.05em;margin:4px 0 2px;color:var(--brand)}
@media (prefers-color-scheme:dark){.sec h2{color:#AFB7FF}}
.sec header p{margin:0;color:var(--muted);font-size:15px}
.items{display:grid}
.item{padding:18px 20px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
.item-head{display:flex;justify-content:space-between;align-items:center;min-height:24px}
.item-head span{font:700 13px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sec footer{padding:12px 20px}
.add{color:var(--brand);border:1px dashed currentColor;background:transparent}
@media (prefers-color-scheme:dark){.add{color:#AFB7FF}}
label{display:grid;gap:6px;font-weight:600;font-size:15px;min-width:0}
label small{font-weight:400;color:var(--muted)}
input,textarea{font:16px var(--body);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;transition:border-color .15s}
input:focus,textarea:focus{border-color:var(--brand)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7}
textarea{resize:vertical;min-height:110px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.row2{grid-template-columns:1fr}}
.compact .item{grid-template-columns:1fr auto;align-items:end;padding-block:12px}
.compact .item-head{display:none}

/* Media */
.media{display:grid;gap:8px}
.media > span{font-weight:600;font-size:15px}
.drop{display:flex;align-items:center;justify-content:center;gap:10px;border:2px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted);font-size:15px;cursor:pointer;background:var(--field);text-align:center;transition:border-color .15s,color .15s}
.drop:hover,.drop.over{border-color:var(--brand);color:var(--brand)}
.drop svg{flex:none}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin:0;padding:0;list-style:none}
.thumbs li{position:relative;width:92px}
.thumbs .pic{width:92px;height:92px;border-radius:10px;object-fit:cover;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-size:12px;font-weight:600;text-align:center;padding:4px;overflow:hidden}
.thumbs .cap{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.thumbs li.bad .pic{outline:2px solid var(--red)}
.thumbs li.bad .cap{color:var(--red)}
.thumbs .x{position:absolute;top:-8px;right:-8px;width:26px;height:26px;padding:0;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:15px;line-height:1;display:grid;place-items:center}
.thumbs .x:hover{border-color:var(--red);color:var(--red)}
.note{font-size:13px;color:var(--muted)}

/* Sticky send bar */
.sendbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,8,80,.08);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.sendbar .wrap{padding-block:12px;display:flex;align-items:center;gap:10px}
.sum{flex:1;min-width:0;display:grid;line-height:1.3}
@media (max-width:420px){.sendbar .primary{padding:11px 18px}.sum span{display:none}}
.sum b{font-size:15px}
.sum span{font-size:13px;color:var(--muted)}
.status{font-size:14px;margin:0;color:var(--muted)}
.status.err{color:var(--red);font-weight:600}
.done{background:var(--ok-soft);border:2px solid var(--ok);border-radius:16px;padding:28px;display:grid;gap:10px;justify-items:start}
.done h2{font:700 30px var(--display);text-transform:uppercase;letter-spacing:.05em;margin:0;color:var(--ok)}
.done p{margin:0}
.footer{text-align:center;font:28px var(--script);color:var(--brand)}
@media (prefers-color-scheme:dark){.footer{color:#AFB7FF}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="band"><div class="wrap">
  <div class="top">
    <div class="brand"><img src="/assets/logo.png" alt="Feldschlösschen"><div><b>Weekly Highlights</b><span>Marketing Feldschlösschen</span></div></div>
    <div class="tools">
      <div class="chip"><span><b id="kwLabel"></b> · <span id="rangeLabel"></span></span><button id="wkToggle" type="button"></button></div>
      <div class="lang" role="group" aria-label="Sprache / Langue"><button id="langDE" type="button" aria-pressed="true">DE</button><button id="langFR" type="button" aria-pressed="false">FR</button></div>
    </div>
  </div>
  <div class="hero">
    <span class="script" id="t-script"></span>
    <h1 id="t-hero"></h1>
    <p id="t-heroSub"></p>
  </div>
</div></div>

<main class="wrap">
  <div id="formArea" style="display:grid;gap:22px"><div id="sections" style="display:grid;gap:22px"></div></div>
  <div class="done" id="doneBox" hidden>
    <h2 id="t-doneTitle"></h2>
    <p id="t-doneText"></p>
    <button id="againBtn" type="button"></button>
  </div>
  <div class="footer">Merci &amp; Proscht!</div>
</main>

<div class="sendbar" id="sendbar"><div class="wrap">
  <div class="sum"><b id="sumLine"></b><span id="subLine"></span></div>
  <button class="ghost" id="resetBtn" type="button"></button>
  <button class="primary" id="sendBtn" type="button"></button>
</div></div>

<script>
const RECIPIENT_NAME = "Astrid";
const MAX_FILE = 4.4*1024*1024;   // per file (server limit)
const MAX_FILES = 10;             // per contribution
const MAX_SIDE = 1400;            // photos are shrunk to this many pixels on their long side

const PARTS = [
  {id:"highlight", fields:["title","detail","next","link"], media:true,
   de:{name:"Highlights der Woche", hint:"Was ist diese Woche gelaufen? Ein Block pro Thema.", title:"Titel", titlePh:"Eine Runde auf uns in der Gastro – McArthur's Pub, Lenzburg", detail:"Was ist passiert?", detailPh:"Im McArthur's Pub in Lenzburg fand bereits die sechste Runde unserer Gastro-Aktion statt …", next:"Nächster Termin", nextPh:"Nächster und letzter Halt: Delémont am 10.09.", link:"Link zu längerem Video", linkPh:"OneDrive, SharePoint, WeTransfer …", opt:"optional", add:"Weiteres Highlight", item:"Highlight"},
   fr:{name:"Les temps forts de la semaine", hint:"Qu'est-ce qui s'est passé cette semaine ? Un bloc par sujet.", title:"Titre", titlePh:"Une tournée offerte en gastro – McArthur's Pub, Lenzburg", detail:"Que s'est-il passé ?", detailPh:"La sixième étape de notre action gastro a eu lieu au McArthur's Pub de Lenzburg …", next:"Prochaine date", nextPh:"Prochaine et dernière étape : Delémont le 10.09.", link:"Lien vers une vidéo plus longue", linkPh:"OneDrive, SharePoint, WeTransfer …", opt:"facultatif", add:"Ajouter un temps fort", item:"Temps fort"}},
  {id:"outlook", fields:["title"], compact:true,
   de:{name:"Ausblick nächste Woche", hint:"Was steht an? Eine Zeile pro Punkt.", title:"Punkt", titlePh:"OLMA-Vorbereitungen", add:"Weiterer Punkt", item:"Punkt"},
   fr:{name:"La semaine prochaine", hint:"Qu'est-ce qui est prévu ? Une ligne par point.", title:"Point", titlePh:"Préparatifs OLMA", add:"Ajouter un point", item:"Point"}},
  {id:"team", fields:["title","detail"],
   de:{name:"Team", hint:"Neue Gesichter, Jubiläen, ein Dankeschön.", title:"Was gibt's Neues?", titlePh:"Willkommen im Team, …", detail:"Ein, zwei Sätze dazu", detailPh:"Seit Montag verstärkt … das Brand-Team.", add:"Weitere Team-News", item:"Team-News"},
   fr:{name:"L'équipe", hint:"Arrivées, anniversaires de service, un merci.", title:"Quoi de neuf ?", titlePh:"Bienvenue dans l'équipe, …", detail:"Une ou deux phrases", detailPh:"Depuis lundi, … renforce l'équipe Brand.", add:"Ajouter une nouvelle", item:"Nouvelle"}}
];
const T = {
  de:{script:"Proscht!", hero:"Was lief diese Woche?", heroSub:"Trag deine Punkte ein und häng Fotos an. "+RECIPIENT_NAME+" macht daraus die Weekly Highlights fürs ganze Marketing.",
      send:"Senden", sending:"Wird gesendet …", uploading:"Fotos werden hochgeladen", reset:"Leeren", confirmReset:"Wirklich leeren?", remove:"Entfernen",
      media:"Fotos und Videos", drop:"Fotos oder Videos hinzufügen", dropSub:"klicken oder hierher ziehen", tooBig:"zu gross", photoNote:"Fotos werden automatisch verkleinert. Videos bis 4,4 MB (ca. 15 Sek.) – längere bitte als Link.",
      lastW:"Letzte Woche?", thisW:"Diese Woche", kw:"KW",
      nothing:"Noch nichts eingetragen", hl:["Highlight","Highlights"], ol:["Ausblick","Ausblick-Punkte"], tm:["Team-News","Team-News"], ph:["Foto/Video","Fotos/Videos"],
      empty:"Du hast noch nichts eingetragen.", fileTooBig:"Eine Datei ist zu gross (max. 4,4 MB). Bitte entfernen und als Link angeben.", tooMany:"Höchstens "+MAX_FILES+" Dateien pro Beitrag.",
      sendFail:"Senden hat nicht geklappt. Bitte nochmals versuchen – deine Eingaben sind gespeichert.", saved:"Entwurf gespeichert",
      doneTitle:"Danke!", doneText:"Dein Beitrag ist bei "+RECIPIENT_NAME+" angekommen.", again:"Weiteren Beitrag erfassen"},
  fr:{script:"Santé !", hero:"Qu'est-ce qui s'est passé cette semaine ?", heroSub:"Saisissez vos points et ajoutez des photos. "+RECIPIENT_NAME+" en fera les Weekly Highlights pour tout le marketing.",
      send:"Envoyer", sending:"Envoi en cours …", uploading:"Envoi des photos", reset:"Effacer", confirmReset:"Vraiment effacer ?", remove:"Retirer",
      media:"Photos et vidéos", drop:"Ajouter des photos ou des vidéos", dropSub:"cliquer ou glisser ici", tooBig:"trop lourd", photoNote:"Les photos sont réduites automatiquement. Vidéos jusqu'à 4,4 Mo (env. 15 s) – pour une vidéo plus longue, indiquez un lien.",
      lastW:"Semaine passée ?", thisW:"Cette semaine", kw:"S",
      nothing:"Rien de saisi pour l'instant", hl:["temps fort","temps forts"], ol:["point à venir","points à venir"], tm:["nouvelle","nouvelles"], ph:["photo/vidéo","photos/vidéos"],
      empty:"Vous n'avez encore rien saisi.", fileTooBig:"Un fichier est trop lourd (4,4 Mo max.). Retirez-le et indiquez plutôt un lien.", tooMany:"Au maximum "+MAX_FILES+" fichiers par contribution.",
      sendFail:"L'envoi n'a pas abouti. Réessayez – votre saisie est conservée.", saved:"Brouillon enregistré",
      doneTitle:"Merci !", doneText:"Votre contribution est bien arrivée chez "+RECIPIENT_NAME+".", again:"Saisir une autre contribution"}
};

const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get("whb-lang")||((navigator.language||"").toLowerCase().startsWith("fr")?"fr":"de");
const tr=k=>T[lang][k];
const plural=(n,k)=>n+" "+T[lang][k][n===1?0:1];

function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();return{y,w:Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7)};}
const fmt=d=>d.getDate()+"."+(d.getMonth()+1)+".";
function weekInfo(offset){
  const m=mondayOf(new Date()); m.setDate(m.getDate()-7*offset);
  const {y,w}=isoWeek(m); const s=new Date(m); s.setDate(s.getDate()+6);
  return {week:w, key:y+"-W"+String(w).padStart(2,"0"), range:fmt(m)+"–"+fmt(s)+s.getFullYear()};
}
let offset=0, W=weekInfo(0);

const FILES=new WeakMap();            // item -> files (kept in memory only)
const filesOf=it=>{ if(!FILES.has(it)) FILES.set(it,[]); return FILES.get(it); };
const mb=b=>(b/1048576).toLocaleString(lang==="fr"?"fr-CH":"de-CH",{maximumFractionDigits:1})+" MB";
const clean=s=>(s||"").replace(/\r/g,"").replace(/\n{3,}/g,"\n\n").trim();

const blank=()=>({highlight:[{}],outlook:[{}],team:[{}]});
function loadDraft(){ try{ const s=JSON.parse(store.get("whb-draft")||"null"); if(s&&s.week===W.key&&s.items) return s.items; }catch(e){} return blank(); }
let state=loadDraft();
let savedFlash=0;
function save(){ store.set("whb-draft",JSON.stringify({week:W.key,items:state})); savedFlash=Date.now(); updateBar(); setTimeout(updateBar,2600); }

async function shrink(file){
  if(!file.type.startsWith("image/") || /gif|svg/.test(file.type)) return {name:file.name, blob:file, kind:file.type.startsWith("video/")?"vid":"img"};
  try{
    const bmp=await createImageBitmap(file);
    const scale=Math.min(1,MAX_SIDE/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*scale); c.height=Math.round(bmp.height*scale);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
    if(blob) return {name:file.name.replace(/\.[^.]+$/,"")+".jpg", blob, kind:"img"};
  }catch(e){}
  return {name:file.name, blob:file, kind:"img"};
}
async function addFiles(it,list){
  for(const f of list){
    if(!/^(image|video)\//.test(f.type)) continue;
    if(allFiles().length>=MAX_FILES){ setStatus(tr("tooMany"),"err"); break; }
    const p=await shrink(f); p.url=p.kind==="img"?URL.createObjectURL(p.blob):""; filesOf(it).push(p);
  }
  render();
}
function allFiles(){ const out=[]; state.highlight.forEach(it=>filesOf(it).forEach(f=>out.push(f))); return out; }

const ICON_UP='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="9" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg>';

function render(){
  document.documentElement.lang=lang;
  ["script","hero","heroSub","doneTitle","doneText"].forEach(k=>$("t-"+k).textContent=tr(k));
  $("againBtn").textContent=tr("again"); $("sendBtn").textContent=tr("send");
  $("kwLabel").textContent=tr("kw")+" "+W.week; $("rangeLabel").textContent=W.range;
  $("wkToggle").textContent=offset===0?tr("lastW"):tr("thisW");
  $("langDE").setAttribute("aria-pressed",lang==="de"); $("langFR").setAttribute("aria-pressed",lang==="fr");
  resetArm(false);
  const box=$("sections"); box.innerHTML="";
  PARTS.forEach((p,pi)=>{
    const L=p[lang];
    const sec=document.createElement("section"); sec.className="sec"+(p.compact?" compact":"");
    sec.innerHTML='<header><span class="num">'+(pi+1)+'</span><div><h2></h2><p></p></div></header><div class="items"></div><footer></footer>';
    sec.querySelector("h2").textContent=L.name; sec.querySelector("header p").textContent=L.hint;
    const items=sec.querySelector(".items");
    state[p.id].forEach((it,ix)=>{
      const card=document.createElement("div"); card.className="item";
      const head=document.createElement("div"); head.className="item-head";
      const lbl=document.createElement("span"); lbl.textContent=L.item+" "+(ix+1); head.append(lbl);
      const rm=document.createElement("button"); rm.className="ghost"; rm.type="button"; rm.textContent=tr("remove");
      rm.onclick=()=>{ filesOf(it).forEach(f=>f.url&&URL.revokeObjectURL(f.url)); state[p.id].splice(ix,1); if(!state[p.id].length) state[p.id].push({}); save(); render(); };
      if(!p.compact){ if(state[p.id].length>1) head.append(rm); card.append(head); }
      const mk=(f,multi,optional)=>{ const l=document.createElement("label"); const s=document.createElement("span"); s.textContent=L[f];
        if(optional){ const o=document.createElement("small"); o.textContent=" · "+L.opt; s.append(o); } l.append(s);
        const el=document.createElement(multi?"textarea":"input"); el.placeholder=L[f+"Ph"]||""; el.value=it[f]||""; el.id=p.id+"-"+ix+"-"+f;
        el.addEventListener("input",()=>{ it[f]=el.value; save(); }); l.append(el); return l; };
      if(p.fields.includes("title")) card.append(mk("title"));
      if(p.fields.includes("detail")) card.append(mk("detail",true));
      if(p.media) card.append(mediaBlock(it,p.id+"-"+ix));
      if(p.fields.includes("next")){ const r=document.createElement("div"); r.className="row2"; r.append(mk("next",false,true),mk("link",false,true)); card.append(r); }
      if(p.compact && state[p.id].length>1) card.append(rm);
      items.append(card);
    });
    const add=document.createElement("button"); add.type="button"; add.className="add"; add.textContent="+ "+L.add;
    add.onclick=()=>{ state[p.id].push({}); save(); render(); const el=$(p.id+"-"+(state[p.id].length-1)+"-title"); if(el) el.focus(); };
    sec.querySelector("footer").append(add);
    box.append(sec);
  });
  updateBar();
}
function mediaBlock(it,key){
  const wrap=document.createElement("div"); wrap.className="media";
  const head=document.createElement("span"); head.textContent=tr("media"); wrap.append(head);
  const input=document.createElement("input"); input.type="file"; input.multiple=true; input.accept="image/*,video/*"; input.hidden=true; input.id=key+"-files";
  input.onchange=()=>{ addFiles(it,[...input.files]); input.value=""; };
  const fs=filesOf(it);
  if(fs.length){
    const list=document.createElement("ul"); list.className="thumbs";
    fs.forEach((f,i)=>{
      const big=f.blob.size>MAX_FILE;
      const li=document.createElement("li"); if(big) li.className="bad";
      let pic; if(f.url){ pic=document.createElement("img"); pic.src=f.url; pic.alt=""; } else { pic=document.createElement("div"); pic.textContent="▶ Video"; }
      pic.className="pic";
      const cap=document.createElement("span"); cap.className="cap"; cap.textContent=big?tr("tooBig")+" · "+mb(f.blob.size):f.name; cap.title=f.name;
      const x=document.createElement("button"); x.className="x"; x.type="button"; x.textContent="×"; x.setAttribute("aria-label",tr("remove")+" "+f.name);
      x.onclick=()=>{ if(f.url) URL.revokeObjectURL(f.url); fs.splice(i,1); render(); };
      li.append(pic,cap,x); list.append(li);
    });
    wrap.append(list);
  }
  const drop=document.createElement("div"); drop.className="drop"; drop.tabIndex=0; drop.setAttribute("role","button");
  drop.innerHTML=ICON_UP+'<span><b></b><br><small></small></span>'; drop.querySelector("b").textContent=tr("drop"); drop.querySelector("small").textContent=tr("dropSub");
  drop.onclick=()=>input.click(); drop.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); input.click(); } };
  drop.ondragover=e=>{ e.preventDefault(); drop.classList.add("over"); }; drop.ondragleave=()=>drop.classList.remove("over");
  drop.ondrop=e=>{ e.preventDefault(); drop.classList.remove("over"); addFiles(it,[...e.dataTransfer.files]); };
  const note=document.createElement("span"); note.className="note"; note.textContent=tr("photoNote");
  wrap.append(input,drop,note);
  return wrap;
}

function counts(){
  return {
    hl: state.highlight.filter(i=>clean(i.title)||clean(i.detail)||filesOf(i).length).length,
    ol: state.outlook.filter(i=>clean(i.title)).length,
    tm: state.team.filter(i=>clean(i.title)||clean(i.detail)).length,
    ph: allFiles().length
  };
}
let statusMsg="", statusKind="";
function setStatus(m,k){ statusMsg=m; statusKind=k||""; updateBar(); }
function updateBar(){
  const c=counts(), parts=[];
  if(c.hl) parts.push(plural(c.hl,"hl")); if(c.ol) parts.push(plural(c.ol,"ol")); if(c.tm) parts.push(plural(c.tm,"tm")); if(c.ph) parts.push(plural(c.ph,"ph"));
  $("sumLine").textContent=parts.length?parts.join(" · "):tr("nothing");
  const sub=$("subLine");
  if(statusMsg){ sub.textContent=statusMsg; sub.className="status"+(statusKind?" "+statusKind:""); }
  else { sub.textContent=Date.now()-savedFlash<2500?tr("saved")+" ✓":tr("kw")+" "+W.week+" · "+W.range; sub.className=""; }
}
let armTimer;
function resetArm(on){ const r=$("resetBtn"); clearTimeout(armTimer); r.dataset.arm=on?"1":""; r.textContent=on?tr("confirmReset"):tr("reset"); if(on) armTimer=setTimeout(()=>resetArm(false),4000); }
$("resetBtn").onclick=()=>{
  if(!$("resetBtn").dataset.arm){ resetArm(true); return; }
  allFiles().forEach(f=>f.url&&URL.revokeObjectURL(f.url)); state=blank(); save(); setStatus(""); render();
};

async function upload(f){
  const res=await fetch("/api/upload",{method:"POST",headers:{"content-type":f.blob.type||"application/octet-stream","x-filename":encodeURIComponent(f.name)},body:f.blob});
  if(!res.ok) throw new Error("upload "+res.status);
  return (await res.json()).key;
}
$("sendBtn").onclick=async ()=>{
  const c=counts();
  if(!c.hl && !c.ol && !c.tm){ setStatus(tr("empty"),"err"); return; }
  const files=allFiles();
  if(files.length>MAX_FILES){ setStatus(tr("tooMany"),"err"); return; }
  if(files.some(f=>f.blob.size>MAX_FILE)){ setStatus(tr("fileTooBig"),"err"); return; }
  const btn=$("sendBtn"); btn.disabled=true; btn.textContent=tr("sending"); setStatus("");
  try{
    for(let i=0;i<files.length;i++){ if(!files[i].key){ setStatus(tr("uploading")+" "+(i+1)+"/"+files.length+" …"); files[i].key=await upload(files[i]); } }
    const items={
      highlight: state.highlight.map(i=>({title:clean(i.title),detail:clean(i.detail),next:clean(i.next),link:clean(i.link),media:filesOf(i).map(f=>({key:f.key,kind:f.kind,name:f.name}))})),
      outlook: state.outlook.map(i=>({title:clean(i.title)})),
      team: state.team.map(i=>({title:clean(i.title),detail:clean(i.detail)}))
    };
    const res=await fetch("/api/submit",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({week:W.key,lang,items})});
    if(!res.ok) throw new Error("submit "+res.status);
    files.forEach(f=>f.url&&URL.revokeObjectURL(f.url));
    state=blank(); store.set("whb-draft",JSON.stringify({week:W.key,items:state}));
    setStatus(""); $("formArea").hidden=true; $("sendbar").hidden=true; $("doneBox").hidden=false; window.scrollTo(0,0);
  }catch(e){ setStatus(tr("sendFail"),"err"); }
  finally{ btn.disabled=false; btn.textContent=tr("send"); }
};
$("againBtn").onclick=()=>{ $("doneBox").hidden=true; $("formArea").hidden=false; $("sendbar").hidden=false; render(); };
$("wkToggle").onclick=()=>{ offset=offset?0:1; W=weekInfo(offset); state=loadDraft(); setStatus(""); render(); };
$("langDE").onclick=()=>{ lang="de"; store.set("whb-lang","de"); render(); };
$("langFR").onclick=()=>{ lang="fr"; store.set("whb-lang","fr"); render(); };
render();
</script>
