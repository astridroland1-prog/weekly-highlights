<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weekly Highlights Marketing</title>
<link rel="icon" href="/assets/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Yellowtail&display=swap">
<style>
/* Layout: brand band (pattern + logo), three section cards, sticky send bar at the bottom. */
:root{
  --brand:#000B72; --brand-hover:#00095A; --brand-soft:#E9EBF7;
  --bg:#F3F4F9; --card:#FFFFFF; --ink:#111633; --muted:#5B6180; --line:#DDE0EE; --field:#F8F9FC;
  --gold:#B1934B; --red:#D02A12; --ok:#2F6B3F; --ok-soft:#E7F2EA;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Arial,sans-serif;
  --script:"Yellowtail","Brush Script MT",cursive;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --brand-soft:#1A1F45; --bg:#0B0E24; --card:#141936; --ink:#E8EAF6; --muted:#A0A6C4; --line:#272E55; --field:#10142E;
  --gold:#D2B46B; --red:#FF7A66; --ok:#7CC48E; --ok-soft:#13301F; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--body)}
[hidden]{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:600 15px var(--body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 16px;cursor:pointer;transition:border-color .15s,background .15s}
button:hover{border-color:var(--brand)}
button:disabled{opacity:.55;cursor:wait}
:is(button,input,textarea,.drop):focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-size:17px;padding:12px 28px}
.primary:hover:not(:disabled){background:var(--brand-hover)}
.ghost{background:transparent;border:0;color:var(--muted);font-weight:500;font-size:14px;padding:4px 6px}
.ghost:hover{color:var(--red)}

/* Brand band */
.band{background:linear-gradient(180deg,rgba(0,11,114,.35),rgba(0,11,114,.7)),#000B72 url("/assets/pattern.jpg") center/cover;color:#fff;border-bottom:4px solid #B1934B}
.band .wrap{padding-block:18px 34px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:54px;height:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.brand b{display:block;font:700 28px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.brand span{font:600 12px var(--display);letter-spacing:.2em;text-transform:uppercase;color:#E7D3A4}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{background:rgba(0,5,50,.55);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;font-size:14px;backdrop-filter:blur(2px)}
.chip b{font:700 18px var(--display);letter-spacing:.05em}
.chip button{padding:4px 10px;font-size:13px;border-radius:999px;background:rgba(255,255,255,.14);border-color:transparent;color:#fff}
.chip button:hover{background:rgba(255,255,255,.28)}
.lang{display:flex;background:rgba(0,5,50,.55);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px}
.lang button{padding:4px 12px;font-size:13px;border-radius:999px;border:0;background:transparent;color:#fff}
.lang button[aria-pressed="true"]{background:#fff;color:#000B72}
.hero{margin-top:28px;max-width:640px}
.hero .script{font:34px/1 var(--script);color:#E7D3A4;display:block}
.hero h1{font:700 clamp(30px,5.5vw,44px)/1.02 var(--display);margin:2px 0 0;text-transform:uppercase;letter-spacing:.03em;text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,40,.5)}
.hero p{margin:10px 0 0;color:#E4E7F7;text-shadow:0 1px 8px rgba(0,0,40,.6)}

/* Sections */
main.wrap{padding-block:22px 60px;display:grid;gap:22px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.sec > header{display:flex;gap:14px;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--line)}
.num{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font:700 19px var(--display);flex:none}
.sec h2{font:700 24px/1.1 var(--display);text-transform:uppercase;letter-spacing:.05em;margin:4px 0 2px;color:var(--brand)}
@media (prefers-color-scheme:dark){.sec h2{color:#AFB7FF}}
.sec header p{margin:0;color:var(--muted);font-size:15px}
.items{display:grid}
.item{padding:18px 20px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
.item-head{display:flex;justify-content:space-between;align-items:center;min-height:24px}
.item-head span{font:700 13px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sec footer{padding:12px 20px}
.add{color:var(--brand);border:1px dashed currentColor;background:transparent}
@media (prefers-color-scheme:dark){.add{color:#AFB7FF}}
label{display:grid;gap:6px;font-weight:600;font-size:15px;min-width:0}
label small{font-weight:400;color:var(--muted)}
input,textarea{font:16px var(--body);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;transition:border-color .15s}
input:focus,textarea:focus{border-color:var(--brand)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7}
textarea{resize:vertical;min-height:110px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.row2{grid-template-columns:1fr}}
.compact .item{grid-template-columns:1fr auto;align-items:end;padding-block:12px}
.compact .item-head{display:none}

/* Media */
.media{display:grid;gap:8px}
.media > span{font-weight:600;font-size:15px}
.drop{display:flex;align-items:center;justify-content:center;gap:10px;border:2px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted);font-size:15px;cursor:pointer;background:var(--field);text-align:center;transition:border-color .15s,color .15s}
.drop:hover,.drop.over{border-color:var(--brand);color:var(--brand)}
.drop svg{flex:none}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin:0;padding:0;list-style:none}
.thumbs li{position:relative;width:92px}
.thumbs .pic{width:92px;height:92px;border-radius:10px;object-fit:cover;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-size:12px;font-weight:600;text-align:center;padding:4px;overflow:hidden}
.thumbs .cap{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.thumbs li.bad .pic{outline:2px solid var(--red)}
.thumbs li.bad .cap{color:var(--red)}
.thumbs .x{position:absolute;top:-8px;right:-8px;width:26px;height:26px;padding:0;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:15px;line-height:1;display:grid;place-items:center}
.thumbs .x:hover{border-color:var(--red);color:var(--red)}
.note{font-size:13px;color:var(--muted)}

/* Sticky send bar */
.sendbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,8,80,.08);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.sendbar .wrap{padding-block:12px;display:flex;align-items:center;gap:10px}
.sum{flex:1;min-width:0;display:grid;line-height:1.3}
@media (max-width:420px){.sendbar .primary{padding:11px 18px}.sum span{display:none}}
.sum b{font-size:15px}
.sum span{font-size:13px;color:var(--muted)}
.status{font-size:14px;margin:0;color:var(--muted)}
.status.err{color:var(--red);font-weight:600}
.done{background:var(--ok-soft);border:2px solid var(--ok);border-radius:16px;padding:28px;display:grid;gap:10px;justify-items:start}
.done h2{font:700 30px var(--display);text-transform:uppercase;letter-spacing:.05em;margin:0;color:var(--ok)}
.done p{margin:0}
.footer{text-align:center;font:28px var(--script);color:var(--brand)}
@media (prefers-color-scheme:dark){.footer{color:#AFB7FF}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Shared board */
.entry{padding:16px 20px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.entry:last-child{border-bottom:0}
.entry h3{margin:0;font-size:17px;line-height:1.35;display:flex;gap:8px;align-items:baseline}
.entry h3::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none;transform:translateY(-2px)}
.entry .txt{margin:0;color:var(--ink);white-space:pre-line;font-size:15px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.entry .minis{display:flex;gap:6px;flex-wrap:wrap}
.entry .minis img,.entry .minis span{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--brand-soft);display:grid;place-items:center;font-size:11px;color:var(--brand)}
.entry .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.entry.line{grid-template-columns:1fr auto;align-items:center;padding-block:10px}
.entry.line h3{font-weight:500;font-size:16px}
.entry.line .foot{display:contents}
.edit{background:var(--brand-soft);border-radius:0}
.edit .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{background:#FFF6E0;color:#6B4E00;border:1px solid #EBD38F;border-radius:10px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (prefers-color-scheme:dark){.hint{background:#3A2E0E;color:#F3DFA6;border-color:#6B5520}}
.hint button{padding:4px 10px;font-size:13px}
.empty-sec{padding:16px 20px;color:var(--muted);font-size:15px;border-bottom:1px solid var(--line)}
.link-btn{background:transparent;border:0;color:var(--brand);font-weight:600;font-size:14px;padding:4px 6px}
@media (prefers-color-scheme:dark){.link-btn{color:#AFB7FF}}
.link-btn:hover{text-decoration:underline}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:999px;font-size:15px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:9;max-width:calc(100% - 32px)}
.toast.err{background:var(--red);color:#fff}
.livebar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--muted);flex-wrap:wrap}
</style>
</head>
<body>
<div class="band"><div class="wrap">
  <div class="top">
    <div class="brand"><img src="/assets/logo.png" alt="Feldschlösschen"><div><b>Weekly Highlights</b><span>Marketing Feldschlösschen</span></div></div>
    <div class="tools">
      <div class="chip"><span><b id="kwLabel"></b> · <span id="rangeLabel"></span></span></div>
      <div class="lang wk" role="group" aria-label="Woche / Semaine"><button data-o="1" type="button"></button><button data-o="0" type="button"></button><button data-o="-1" type="button"></button></div>
      <div class="lang" role="group" aria-label="Sprache / Langue"><button id="langDE" type="button" aria-pressed="true">DE</button><button id="langFR" type="button" aria-pressed="false">FR</button></div>
    </div>
  </div>
  <div class="hero">
    <span class="script" id="t-script"></span>
    <h1 id="t-hero"></h1>
    <p id="t-heroSub"></p>
  </div>
</div></div>

<main class="wrap">
  <p class="hint" id="weekNote" hidden></p>
  <div class="livebar"><span id="liveInfo"></span><button class="link-btn" id="refreshBtn" type="button"></button></div>
  <div id="sections" style="display:grid;gap:22px"></div>
  <div class="footer">Merci &amp; Proscht!</div>
  <p style="text-align:center;margin:0"><a href="/zusammenstellen" style="color:var(--muted);font-size:13px">Zusammenstellung (nur Astrid)</a></p>
</main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
const RECIPIENT_NAME = "Astrid";
const MAX_FILE = 4.4*1024*1024;   // per file (server limit)
const MAX_FILES = 10;             // per entry
const MAX_SIDE = 1400;            // photos are shrunk to this many pixels on their long side
const POLL_MS = 30000;            // refresh the board while nobody is editing

const PARTS = [
  {id:"highlight", fields:["title","detail","link"], media:true,
   de:{name:"Highlights der Woche", hint:"Ein Eintrag pro Thema. Schau zuerst, ob dein Thema schon da ist – dann ergänze es.", title:"Titel", titlePh:"Eine Runde auf uns in der Gastro – McArthur's Pub, Lenzburg", detail:"Was ist passiert?", detailPh:"Im McArthur's Pub in Lenzburg fand bereits die sechste Runde unserer Gastro-Aktion statt …", link:"Link zu längerem Video", linkPh:"OneDrive, SharePoint, WeTransfer …", opt:"optional", add:"Neues Highlight", none:"Noch keine Highlights für diese Woche."},
   fr:{name:"Les temps forts de la semaine", hint:"Un bloc par sujet. Vérifiez d'abord si votre sujet existe déjà – dans ce cas, complétez-le.", title:"Titre", titlePh:"Une tournée offerte en gastro – McArthur's Pub, Lenzburg", detail:"Que s'est-il passé ?", detailPh:"La sixième étape de notre action gastro a eu lieu au McArthur's Pub de Lenzburg …", link:"Lien vers une vidéo plus longue", linkPh:"OneDrive, SharePoint, WeTransfer …", opt:"facultatif", add:"Nouveau temps fort", none:"Aucun temps fort pour cette semaine."}},
  {id:"outlook", fields:["title"], line:true,
   de:{name:"Ausblick nächste Woche", hint:"Eine Zeile pro Punkt.", title:"Punkt", titlePh:"OLMA-Vorbereitungen", add:"Neuer Punkt", none:"Noch keine Punkte."},
   fr:{name:"La semaine prochaine", hint:"Une ligne par point.", title:"Point", titlePh:"Préparatifs OLMA", add:"Nouveau point", none:"Aucun point pour l'instant."}},
  {id:"team", fields:["title","detail"],
   de:{name:"Team", hint:"Neue Gesichter, Jubiläen, ein Dankeschön.", title:"Was gibt's Neues?", titlePh:"Willkommen im Team, …", detail:"Ein, zwei Sätze dazu", detailPh:"Seit Montag verstärkt … das Brand-Team.", opt:"optional", add:"Neue Team-News", none:"Noch keine Team-News."},
   fr:{name:"L'équipe", hint:"Arrivées, anniversaires de service, un merci.", title:"Quoi de neuf ?", titlePh:"Bienvenue dans l'équipe, …", detail:"Une ou deux phrases", detailPh:"Depuis lundi, … renforce l'équipe Brand.", opt:"facultatif", add:"Nouvelle nouvelle", none:"Aucune nouvelle pour l'instant."}}
];
const T = {
  de:{script:"Proscht!", hero:"Was lief diese Woche?", heroSub:"Hier seht ihr alles, was das Team schon eingetragen hat. Ergänzt bestehende Einträge oder fügt neue hinzu – "+RECIPIENT_NAME+" macht daraus die Weekly Highlights.",
      edit:"Bearbeiten / ergänzen", save:"Speichern", saving:"Wird gespeichert …", cancel:"Abbrechen", remove:"Entfernen", saved:"Gespeichert ✓", uploading:"Fotos werden hochgeladen",
      media:"Fotos und Videos", drop:"Fotos oder Videos hinzufügen", dropSub:"klicken oder hierher ziehen", tooBig:"zu gross", photoNote:"Fotos werden automatisch verkleinert. Videos bis 4,4 MB (ca. 15 Sek.) – längere bitte als Link.",
      lastW:"Letzte Woche", thisW:"Diese Woche", nextW:"Nächste Woche", nextNote:"Ihr tragt für nächste Woche ein. Diese Einträge erscheinen in den Weekly Highlights der KW {w}.", lastNote:"Ihr tragt für letzte Woche ein (KW {w}).", kw:"KW", refresh:"Aktualisieren", loading:"Lädt …", loadFail:"Einträge konnten nicht geladen werden. «Aktualisieren» versuchen.",
      updated:"Stand", entries:["Eintrag","Einträge"], changed:"geändert", added:"erstellt", justNow:"gerade eben", minAgo:"vor {n} Min.", hAgo:"vor {n} Std.",
      empty:"Bitte zuerst etwas eintragen.", fileTooBig:"Eine Datei ist zu gross (max. 4,4 MB). Bitte entfernen und als Link angeben.", tooMany:"Höchstens "+MAX_FILES+" Dateien pro Eintrag.",
      saveFail:"Speichern hat nicht geklappt. Bitte nochmals versuchen.", conflict:"Jemand hat diesen Eintrag gerade geändert. Die neue Version wird angezeigt – bitte deine Ergänzung nochmals einfügen.",
      similar:"Ähnlicher Eintrag schon vorhanden:", useIt:"Diesen ergänzen", unsaved:"Ungespeicherte Änderungen gehen verloren. Trotzdem schliessen?", photos:"Fotos"},
  fr:{script:"Santé !", hero:"Qu'est-ce qui s'est passé cette semaine ?", heroSub:"Vous voyez ici tout ce que l'équipe a déjà saisi. Complétez les entrées existantes ou ajoutez-en de nouvelles – "+RECIPIENT_NAME+" en fera les Weekly Highlights.",
      edit:"Modifier / compléter", save:"Enregistrer", saving:"Enregistrement …", cancel:"Annuler", remove:"Retirer", saved:"Enregistré ✓", uploading:"Envoi des photos",
      media:"Photos et vidéos", drop:"Ajouter des photos ou des vidéos", dropSub:"cliquer ou glisser ici", tooBig:"trop lourd", photoNote:"Les photos sont réduites automatiquement. Vidéos jusqu'à 4,4 Mo (env. 15 s) – pour une vidéo plus longue, indiquez un lien.",
      lastW:"Semaine passée", thisW:"Cette semaine", nextW:"Semaine prochaine", nextNote:"Vous saisissez pour la semaine prochaine. Ces entrées paraîtront dans les Weekly Highlights de la S{w}.", lastNote:"Vous saisissez pour la semaine passée (S{w}).", kw:"S", refresh:"Actualiser", loading:"Chargement …", loadFail:"Impossible de charger les entrées. Essayez « Actualiser ».",
      updated:"Mis à jour", entries:["entrée","entrées"], changed:"modifié", added:"créé", justNow:"à l'instant", minAgo:"il y a {n} min", hAgo:"il y a {n} h",
      empty:"Saisissez d'abord quelque chose.", fileTooBig:"Un fichier est trop lourd (4,4 Mo max.). Retirez-le et indiquez plutôt un lien.", tooMany:"Au maximum "+MAX_FILES+" fichiers par entrée.",
      saveFail:"L'enregistrement n'a pas abouti. Réessayez.", conflict:"Quelqu'un vient de modifier cette entrée. La nouvelle version s'affiche – ajoutez à nouveau votre complément.",
      similar:"Une entrée semblable existe déjà :", useIt:"Compléter celle-ci", unsaved:"", photos:"photos"}
};

const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get("whb-lang")||((navigator.language||"").toLowerCase().startsWith("fr")?"fr":"de");
const tr=k=>T[lang][k];
const clean=s=>(s||"").replace(/\r/g,"").replace(/\n{3,}/g,"\n\n").trim();
const mb=b=>(b/1048576).toLocaleString(lang==="fr"?"fr-CH":"de-CH",{maximumFractionDigits:1})+" MB";

function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();return{y,w:Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7)};}
const fmt=d=>d.getDate()+"."+(d.getMonth()+1)+".";
function weekInfo(offset){
  const m=mondayOf(new Date()); m.setDate(m.getDate()-7*offset);
  const {y,w}=isoWeek(m); const s=new Date(m); s.setDate(s.getDate()+6);
  return {week:w, key:y+"-W"+String(w).padStart(2,"0"), range:fmt(m)+"–"+fmt(s)+s.getFullYear()};
}
let offset=0, W=weekInfo(0);

// ---------- State ----------
let items=[];             // entries of the week, from the server
let loadedAt=null, loadError=false;
let editing=null;         // {section, id|null, draft:{title,detail,link}, media:[{key?,kind,name,url,blob?}], busy, msg}
const ago=iso=>{ const m=Math.round((Date.now()-new Date(iso))/60000); if(m<1) return tr("justNow"); if(m<60) return tr("minAgo").replace("{n}",m); return tr("hAgo").replace("{n}",Math.round(m/60)); };
const mediaUrl=k=>"/api/media/"+k;

async function load(){
  if(editing) return;
  try{
    const r=await fetch("/api/items?week="+encodeURIComponent(W.key),{cache:"no-store"});
    if(!r.ok) throw 0;
    items=(await r.json()).items||[]; loadedAt=new Date(); loadError=false;
  }catch(e){ loadError=true; }
  render();
}
setInterval(()=>{ if(!editing && document.visibilityState==="visible") load(); },POLL_MS);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && !editing) load(); });

// ---------- Editing ----------
function startEdit(section,item){
  if(editing && isDirty() && !confirmLeave()) return;
  editing={section, id:item?item.id:null, etag:item?item.etag:null,
    draft:{title:item?.title||"", detail:item?.detail||"", link:item?.link||""},
    orig:JSON.stringify({title:item?.title||"",detail:item?.detail||"",link:item?.link||"",m:(item?.media||[]).map(m=>m.key)}),
    media:(item?.media||[]).map(m=>({...m,url:m.kind==="img"?mediaUrl(m.key):""})), busy:false, msg:""};
  render();
  const el=$("ed-title"); if(el){ el.focus(); el.scrollIntoView({block:"center",behavior:"smooth"}); }
}
function isDirty(){ if(!editing) return false; const d=editing.draft; return JSON.stringify({title:d.title,detail:d.detail,link:d.link,m:editing.media.map(m=>m.key||m.url)})!==editing.orig; }
let leaveArm=0;
function confirmLeave(){ if(Date.now()-leaveArm<4000) return true; leaveArm=Date.now(); toast(lang==="fr"?"Modifications non enregistrées – cliquez encore pour fermer.":"Ungespeicherte Änderungen – nochmals klicken zum Schliessen.","err"); return false; }
function stopEdit(){ editing.media.forEach(m=>m.blob&&m.url&&URL.revokeObjectURL(m.url)); editing=null; render(); load(); }

async function shrink(file){
  if(!file.type.startsWith("image/") || /gif|svg/.test(file.type)) return {name:file.name, blob:file, kind:file.type.startsWith("video/")?"vid":"img"};
  try{
    const bmp=await createImageBitmap(file);
    const scale=Math.min(1,MAX_SIDE/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*scale); c.height=Math.round(bmp.height*scale);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
    if(blob) return {name:file.name.replace(/\.[^.]+$/,"")+".jpg", blob, kind:"img"};
  }catch(e){}
  return {name:file.name, blob:file, kind:"img"};
}
async function addFiles(list){
  for(const f of list){
    if(!/^(image|video)\//.test(f.type)) continue;
    if(editing.media.length>=MAX_FILES){ editing.msg=tr("tooMany"); break; }
    const p=await shrink(f); p.url=p.kind==="img"?URL.createObjectURL(p.blob):""; editing.media.push(p);
  }
  render();
}
async function upload(m){
  const res=await fetch("/api/upload",{method:"POST",headers:{"content-type":m.blob.type||"application/octet-stream","x-filename":encodeURIComponent(m.name)},body:m.blob});
  if(!res.ok) throw new Error("upload");
  return (await res.json()).key;
}
async function saveEdit(){
  const e=editing, d=e.draft;
  if(!clean(d.title) && !clean(d.detail) && !e.media.length){ e.msg=tr("empty"); render(); return; }
  if(e.media.some(m=>m.blob && m.blob.size>MAX_FILE)){ e.msg=tr("fileTooBig"); render(); return; }
  e.busy=true; e.msg=""; render();
  try{
    const news=e.media.filter(m=>!m.key);
    for(let i=0;i<news.length;i++){ e.msg=tr("uploading")+" "+(i+1)+"/"+news.length+" …"; render(); news[i].key=await upload(news[i]); }
    const payload={title:clean(d.title),detail:clean(d.detail),link:clean(d.link),media:e.media.map(m=>({key:m.key,kind:m.kind,name:m.name}))};
    let res;
    if(e.id) res=await fetch("/api/items?id="+encodeURIComponent(e.id),{method:"PUT",headers:{"content-type":"application/json","if-match":e.etag||""},body:JSON.stringify(payload)});
    else res=await fetch("/api/items",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({...payload,week:W.key,section:e.section})});
    if(res.status===409){
      const j=await res.json(); const fresh=j.item;
      if(fresh){ items=items.map(x=>x.id===fresh.id?fresh:x); e.etag=fresh.etag; e.draft={title:fresh.title||"",detail:fresh.detail||"",link:fresh.link||""};
        e.media=(fresh.media||[]).map(m=>({...m,url:m.kind==="img"?mediaUrl(m.key):""})); }
      e.busy=false; e.msg=tr("conflict"); render(); return;
    }
    if(!res.ok) throw new Error("save");
    e.media.forEach(m=>m.blob&&m.url&&URL.revokeObjectURL(m.url));
    editing=null; toast(tr("saved")); await load();
  }catch(err){ e.busy=false; e.msg=tr("saveFail"); render(); }
}

// Similar title check for new entries (shared words of 4+ letters).
const words=s=>new Set((s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").split(/[^a-z0-9]+/).filter(w=>w.length>=4));
function similarTo(section,title){
  const a=words(title); if(a.size<1) return null;
  let best=null,score=0;
  items.filter(i=>i.section===section).forEach(i=>{ const b=words(i.title+" "+(i.detail||"").slice(0,200)); let n=0; a.forEach(w=>{ if(b.has(w)) n++; }); const s=n/a.size; if(s>score){ score=s; best=i; } });
  return score>=0.5?best:null;
}

// ---------- Rendering ----------
const ICON_UP='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="9" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg>';
function el(tag,cls,text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

function render(){
  document.documentElement.lang=lang;
  ["script","hero","heroSub"].forEach(k=>$("t-"+k).textContent=tr(k));
  $("kwLabel").textContent=tr("kw")+" "+W.week; $("rangeLabel").textContent=W.range;
  document.querySelectorAll(".wk button").forEach(b=>{ const o=+b.dataset.o; b.textContent=o===1?tr("lastW"):o===0?tr("thisW"):tr("nextW"); b.setAttribute("aria-pressed",o===offset); });
  const wn=$("weekNote"); wn.hidden=offset===0; wn.textContent=offset<0?tr("nextNote").replace("{w}",W.week):tr("lastNote").replace("{w}",W.week);
  $("langDE").setAttribute("aria-pressed",lang==="de"); $("langFR").setAttribute("aria-pressed",lang==="fr");
  $("refreshBtn").textContent="↻ "+tr("refresh");
  $("liveInfo").textContent=loadError?tr("loadFail"):!loadedAt?tr("loading"):items.length+" "+tr("entries")[items.length===1?0:1]+" · "+tr("updated")+" "+loadedAt.toLocaleTimeString(lang==="fr"?"fr-CH":"de-CH",{hour:"2-digit",minute:"2-digit"});
  const box=$("sections"); box.innerHTML="";
  PARTS.forEach((p,pi)=>{
    const L=p[lang];
    const sec=el("section","sec");
    sec.innerHTML='<header><span class="num">'+(pi+1)+'</span><div><h2></h2><p></p></div></header><div class="items"></div><footer></footer>';
    sec.querySelector("h2").textContent=L.name; sec.querySelector("header p").textContent=L.hint;
    const list=sec.querySelector(".items");
    const mine=items.filter(i=>i.section===p.id);
    if(!mine.length && !(editing && editing.section===p.id)) list.append(el("div","empty-sec",L.none));
    mine.forEach(it=>{ list.append(editing && editing.id===it.id ? editor(p,L) : view(p,L,it)); });
    if(editing && editing.section===p.id && !editing.id) list.append(editor(p,L));
    const add=el("button","add","+ "+L.add); add.type="button";
    add.onclick=()=>startEdit(p.id,null);
    if(!(editing && editing.section===p.id && !editing.id)) sec.querySelector("footer").append(add);
    box.append(sec);
  });
}
function view(p,L,it){
  const card=el("div","entry"+(p.line?" line":""));
  card.append(el("h3","",it.title||(it.detail||"").split("\n")[0]));
  if(!p.line && it.detail && it.title) card.append(el("p","txt",it.detail));
  if(it.media && it.media.length){
    const m=el("div","minis");
    it.media.slice(0,6).forEach(x=>{ if(x.kind==="img"){ const i=document.createElement("img"); i.src=mediaUrl(x.key); i.alt=""; i.loading="lazy"; m.append(i); } else m.append(el("span","","▶")); });
    if(it.media.length>6) m.append(el("span","","+"+(it.media.length-6)));
    card.append(m);
  }
  const foot=el("div","foot");
  if(!p.line) foot.append(el("span","",(it.updatedAt!==it.createdAt?tr("changed"):tr("added"))+" "+ago(it.updatedAt)));
  const b=el("button","link-btn","✎ "+tr("edit")); b.type="button"; b.onclick=()=>startEdit(p.id,it);
  foot.append(b); card.append(foot);
  return card;
}
function editor(p,L){
  const e=editing, card=el("div","item edit");
  const mk=(f,multi,optional)=>{ const l=el("label"); const s=el("span","",L[f]); if(optional) s.append(el("small",""," · "+L.opt)); l.append(s);
    const x=document.createElement(multi?"textarea":"input"); x.placeholder=L[f+"Ph"]||""; x.value=e.draft[f]||""; x.id="ed-"+f;
    x.addEventListener("input",()=>{ e.draft[f]=x.value; if(f==="title"&&!e.id) showSimilar(); }); l.append(x); return l; };
  card.append(mk("title"));
  const simBox=el("div"); simBox.id="simBox"; card.append(simBox);
  if(p.fields.includes("detail")) card.append(mk("detail",true,p.id==="team"));
  if(p.media) card.append(mediaBlock());
  if(p.fields.includes("link")) card.append(mk("link",false,true));
  if(e.msg) card.append(el("p","status err",e.msg));
  const act=el("div","actions");
  const sv=el("button","primary",e.busy?tr("saving"):tr("save")); sv.type="button"; sv.disabled=e.busy; sv.onclick=saveEdit;
  const cc=el("button","ghost",tr("cancel")); cc.type="button"; cc.disabled=e.busy; cc.onclick=()=>{ if(isDirty() && !confirmLeave()) return; stopEdit(); };
  act.append(sv,cc); card.append(act);
  setTimeout(()=>{ if(!e.id) showSimilar(); },0);
  return card;
}
function showSimilar(){
  const box=$("simBox"); if(!box||!editing) return; box.innerHTML="";
  const s=similarTo(editing.section,editing.draft.title); if(!s) return;
  const h=el("div","hint"); h.append(el("span","",tr("similar")+" «"+(s.title||"")+"»"));
  const b=el("button","",tr("useIt")); b.type="button"; b.onclick=()=>{ editing=null; startEdit(s.section,s); };
  h.append(b); box.append(h);
}
function mediaBlock(){
  const e=editing, wrap=el("div","media");
  wrap.append(el("span","",tr("media")));
  const input=document.createElement("input"); input.type="file"; input.multiple=true; input.accept="image/*,video/*"; input.hidden=true; input.id="ed-files";
  input.onchange=()=>{ addFiles([...input.files]); input.value=""; };
  if(e.media.length){
    const list=el("ul","thumbs");
    e.media.forEach((f,i)=>{
      const big=f.blob && f.blob.size>MAX_FILE;
      const li=el("li",big?"bad":"");
      let pic; if(f.url){ pic=document.createElement("img"); pic.src=f.url; pic.alt=""; } else pic=el("div","","▶ Video");
      pic.className="pic";
      const cap=el("span","cap",big?tr("tooBig")+" · "+mb(f.blob.size):f.name); cap.title=f.name;
      const x=el("button","x","×"); x.type="button"; x.setAttribute("aria-label",tr("remove")+" "+f.name);
      x.onclick=()=>{ if(f.blob&&f.url) URL.revokeObjectURL(f.url); e.media.splice(i,1); render(); };
      li.append(pic,cap,x); list.append(li);
    });
    wrap.append(list);
  }
  const drop=el("div","drop"); drop.tabIndex=0; drop.setAttribute("role","button");
  drop.innerHTML=ICON_UP+'<span><b></b><br><small></small></span>'; drop.querySelector("b").textContent=tr("drop"); drop.querySelector("small").textContent=tr("dropSub");
  drop.onclick=()=>input.click(); drop.onkeydown=ev=>{ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); input.click(); } };
  drop.ondragover=ev=>{ ev.preventDefault(); drop.classList.add("over"); }; drop.ondragleave=()=>drop.classList.remove("over");
  drop.ondrop=ev=>{ ev.preventDefault(); drop.classList.remove("over"); addFiles([...ev.dataTransfer.files]); };
  wrap.append(input,drop,el("span","note",tr("photoNote")));
  return wrap;
}
let toastTimer;
function toast(msg,kind){ const t=$("toast"); t.textContent=msg; t.className="toast"+(kind?" "+kind:""); t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true,3500); }

$("refreshBtn").onclick=()=>{ if(editing){ if(isDirty() && !confirmLeave()) return; editing=null; } load(); };
document.querySelectorAll(".wk button").forEach(b=>b.onclick=()=>{ const o=+b.dataset.o; if(o===offset) return; if(editing){ if(isDirty() && !confirmLeave()) return; editing=null; } offset=o; W=weekInfo(offset); items=[]; loadedAt=null; render(); load(); });
$("langDE").onclick=()=>{ lang="de"; store.set("whb-lang","de"); render(); };
$("langFR").onclick=()=>{ lang="fr"; store.set("whb-lang","fr"); render(); };
window.addEventListener("beforeunload",ev=>{ if(isDirty()){ ev.preventDefault(); ev.returnValue=""; } });
render(); load();

</script>
